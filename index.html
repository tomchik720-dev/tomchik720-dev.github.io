<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>LOVE YOU</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020002;
    }

    body {
        position: relative;
    }

    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #020002;
    }

    /* Подсказка */
    #hint {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 117, 184, 0.35);
        font-family: Arial, sans-serif;
        font-size: 11px;
        pointer-events: none;
        user-select: none;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="hint">Нажмите на экран</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W;
let H;
let CX;
let CY;
let SCALE;

const COUNT = 300;

const PINK = "#ff1493";
const PINK_LIGHT = "#ff4fa3";
const PINK_SOFT = "#ff75b8";

let particles = [];
let startTime = performance.now();


// ============================================================
// РАЗМЕР CANVAS
// ============================================================

function resize() {

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    CX = W / 2;
    CY = H / 2;

    // Аналог SCALE = min(W,H)/32
    SCALE = Math.min(W, H) / 32;
}

resize();

window.addEventListener("resize", () => {
    resize();
    createParticles();
});


// ============================================================
// ФОРМА СЕРДЦА
// ============================================================

function heartPoint(t) {

    const x =
        16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: CX + x * SCALE,
        y: CY - y * SCALE
    };
}


// ============================================================
// ПЛАВНОСТЬ
// ============================================================

function ease(t) {

    return t * t * (3 - 2 * t);
}


// ============================================================
// СОЗДАЁМ ЧАСТИЦЫ
// ============================================================

function createParticles() {

    particles = [];

    for (let i = 0; i < COUNT; i++) {

        const t =
            (i / COUNT) * Math.PI * 2;

        const target =
            heartPoint(t);

        // Небольшой разброс
        target.x += random(-5, 5);
        target.y += random(-5, 5);

        let sx;
        let sy;

        const side =
            Math.floor(Math.random() * 4);

        if (side === 0) {

            sx = random(0, W);
            sy = random(-H, 0);

        } else if (side === 1) {

            sx = random(W, W + 300);
            sy = random(0, H);

        } else if (side === 2) {

            sx = random(0, W);
            sy = random(H, H + 300);

        } else {

            sx = random(-300, 0);
            sy = random(0, H);
        }

        const size =
            Math.floor(random(10, 18));

        const colors = [
            PINK,
            PINK,
            PINK_LIGHT,
            PINK_SOFT
        ];

        particles.push({

            sx,
            sy,

            tx: target.x,
            ty: target.y,

            size,

            color:
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ],

            delay:
                i * 0.018
        });
    }
}


// ============================================================
// RANDOM
// ============================================================

function random(min, max) {

    return Math.random() *
        (max - min) +
        min;
}


// ============================================================
// РИСУЕМ LOVE YOU
// ============================================================

function drawText(text, x, y, size, color) {

    ctx.font =
        `bold ${size}px Arial`;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = color;

    ctx.fillText(
        text,
        x,
        y
    );
}


// ============================================================
// АНИМАЦИЯ
// ============================================================

function animate(now) {

    const currentTime =
        (now - startTime) / 1000;

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    for (const p of particles) {

        // Слово ещё не появилось
        if (currentTime < p.delay) {
            continue;
        }

        let progress =
            (currentTime - p.delay) / 2.5;

        progress =
            Math.max(
                0,
                Math.min(
                    1,
                    progress
                )
            );

        const smooth =
            ease(progress);

        // Полёт к сердцу
        let x =
            p.sx +
            (p.tx - p.sx) *
            smooth;

        let y =
            p.sy +
            (p.ty - p.sy) *
            smooth;

        // Лёгкое колебание
        if (progress < 1) {

            const wave =
                Math.sin(
                    currentTime * 5 +
                    p.delay * 8
                ) *
                4 *
                (1 - smooth);

            x += wave;
        }

        drawText(
            "LOVE YOU",
            x,
            y,
            p.size,
            p.color
        );
    }

    requestAnimationFrame(animate);
}


// ============================================================
// ЗАПУСК
// ============================================================

createParticles();

requestAnimationFrame(animate);


// ============================================================
// НАЖАТИЕ НА ЭКРАН — ЗАПУСК ЗАНОВО
// ============================================================

document.addEventListener("click", () => {

    startTime = performance.now();

    createParticles();

});


// ============================================================
// TOUCH
// ============================================================

document.addEventListener(
    "touchstart",
    () => {

        startTime = performance.now();

        createParticles();

    },
    { passive: true }
);

</script>

</body>
</html>
